<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    
    <div class="container mt-5 w-50 border p-4 rounded shadow">        
        <form>

            
            <!-- Nombre -->
            <div class="mb-3">
                <label for="Nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Ingrese su nombre">
            </div>

            <!--Correo -->
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
            </div>


            <!-- Mensaje -->
            <div class="mb-3 m4">
                <label for="Comentarios" class="form-label">Comentarios</label>
                <input type="text" class="form-control" placeholder="Denos su opinion positiva y nada negativa">
            </div>

            <!--Enviar-->
            <button type="submit" class="mb-3 btn btn-primary w-100">Ingresar</button>


            
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
